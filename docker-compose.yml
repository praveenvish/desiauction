# Local infrastructure (IP-0_DESIGN §10). Credentials are local-only and
# deliberately non-secret; every deployed environment uses platform secrets.

# Named explicitly rather than inherited from the directory. Compose otherwise
# derives the project (and every container name) from whatever the checkout
# happens to be called, so a second clone, a rename, or a worktree silently
# produces a DIFFERENT set of containers and volumes against the same ports —
# and two checkouts fight over 5433. Pinning the name makes the containers
# belong to the project, not to the folder.
name: desiauction

services:
  db:
    image: postgres:17-alpine
    container_name: desiauction-postgres
    # 5433 is this project's port and stays the default — CI service containers,
    # the docs and every test fallback name it. But a laptop runs more than one
    # project, and when something else takes 5433 the answer must not be "stop
    # the other thing" or "renumber ours everywhere". Set DB_PORT in the shell
    # (or in a root `.env`, which compose reads) and point DATABASE_URL at the
    # same number:
    #
    #   DB_PORT=5436 docker compose up -d
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: desiauction
      POSTGRES_PASSWORD: desiauction
      POSTGRES_DB: desiauction
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desiauction"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    image: minio/minio:latest
    container_name: desiauction-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: desiauction
      MINIO_ROOT_PASSWORD: desiauction
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
