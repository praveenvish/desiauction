<!doctype html>
<html lang="en" data-theme="daylight">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>DesiAuction · Interface study</title>
    <link rel="stylesheet" href="/tokens/primitives.css" />
    <link rel="stylesheet" href="/tokens/daylight.css" />
    <link rel="stylesheet" href="/tokens/floodlight.css" />
    <link rel="stylesheet" href="/prototype.css" />
    <script src="/prototype.js" defer></script>
  </head>
  <body>
    <div class="study-bar">
      <span>INTERACTIVE DESIGN · EXAMPLE DATA</span
      ><button id="theme" type="button" aria-label="Switch to Floodlight theme">Floodlight</button>
    </div>
    <div class="app">
      <aside class="rail" aria-label="Workspace">
        <a class="brand" href="/?view=home">DESI<span>AUCTION</span></a>
        <p class="rail-label">DESIGN JOURNEYS</p>
        <nav id="navigation" aria-label="Design journeys"></nav>
        <div class="rail-note">
          One platform.<br />Every match day.
          <p>Local design study. No scores, bids or money are submitted.</p>
        </div>
      </aside>
      <main id="main" tabindex="-1"></main>
    </div>
    <div id="notice" role="status" aria-live="polite" class="notice" hidden></div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="dialog-body">
        <p class="eyebrow">CHECK THE CONSEQUENCE</p>
        <h2 id="dialog-title"></h2>
        <p id="dialog-copy"></p>
        <div class="dialog-actions">
          <button id="cancel-dialog" type="button">Go back</button
          ><button id="confirm-dialog" class="primary" type="button">Confirm example</button>
        </div>
      </div>
    </dialog>
  </body>
</html>
