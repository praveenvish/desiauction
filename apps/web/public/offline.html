<!doctype html>
<!--
  THE OFFLINE SCREEN (public/sw.js). Shown in place of a page that could not be
  reached, at that page's own address, so retrying means "load what you asked
  for".

  SELF-CONTAINED ON PURPOSE: no stylesheet, font, image or script FILE. It is
  stored once at install and must render from the device alone, after any
  number of deploys have renamed every build file it could have linked.

  HOW IT COMES BACK. Not a timed meta refresh: that moves a screen reader's
  focus mid-sentence (WCAG 2.2.1, axe's meta-refresh rule). Not the `online`
  event alone either: it never fires on a captive Wi-Fi or when it was the
  server, not the phone, that was unreachable. The script asks /healthz (tiny,
  no database) on a backing-off timer while the screen is visible, at once on
  `online` and on returning to the tab, and reloads only when it answers. Every
  background check that fails changes nothing on screen, so nothing is
  announced; "Try again" says what happened. Without script, "Try again" is a
  plain link to this address and the screen still works.

  The inline script is allowed because this file is served without the
  per-request script policy (middleware.ts skips it).

  Editing this file changes its digest: update OFFLINE_REVISION in sw.js to the
  value pwa.test.ts prints, or devices keep the old page.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>You’re offline · DesiAuction</title>
    <script>
      // The theme the person chose in the app (theme-toggle.tsx, "da-theme"),
      // before first paint; without a choice, the device's own.
      try {
        var theme = localStorage.getItem("da-theme");
        if (theme === "floodlight" || theme === "daylight") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (error) {}
    </script>
    <style>
      :root {
        color-scheme: light;
        --surface: #fbfaf7;
        --raised: #ffffff;
        --text: #2b2822;
        --muted: #58534a;
        --line: rgba(43, 40, 34, 0.12);
        --gold: #f0b43c;
        --gold-hover: #f6c659;
        --gold-lift: #f3d078;
        --gold-edge: #b57f14;
        --on-gold: #070a0f;
        --glow: transparent;
      }
      :root[data-theme="floodlight"] {
        color-scheme: dark;
        --surface: #0b1018;
        --raised: #101623;
        --text: #c9d4e8;
        --muted: #9fb0cc;
        --line: rgba(201, 212, 232, 0.14);
        --gold: #e6b24a;
        --gold-hover: #f3d078;
        --gold-lift: #f3d078;
        --gold-edge: #d8a439;
        --glow: rgba(201, 212, 232, 0.07);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="daylight"]) {
          color-scheme: dark;
          --surface: #0b1018;
          --raised: #101623;
          --text: #c9d4e8;
          --muted: #9fb0cc;
          --line: rgba(201, 212, 232, 0.14);
          --gold: #e6b24a;
          --gold-hover: #f3d078;
          --gold-lift: #f3d078;
          --gold-edge: #d8a439;
          --glow: rgba(201, 212, 232, 0.07);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        /* Optical centre: a little above the middle, as a native empty state sits. */
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
          max(calc(24px + 6vh), env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        background:
          radial-gradient(120% 55% at 50% 0%, var(--glow), transparent 70%), var(--surface);
        color: var(--text);
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 22rem;
        text-align: center;
      }
      .mark {
        position: relative;
        width: 72px;
        height: 72px;
        margin-bottom: 32px;
      }
      .mark svg {
        display: block;
      }
      /* Off the glyph: it sits on the tile's corner and never covers the mark. */
      .badge {
        position: absolute;
        right: -16px;
        bottom: -14px;
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border: 3px solid var(--surface);
        border-radius: 50%;
        background: var(--raised);
        color: var(--text);
        box-shadow: 0 0 0 1px var(--line);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.5rem;
        line-height: 1.2;
        letter-spacing: -0.01em;
        text-wrap: balance;
      }
      p {
        margin: 0;
      }
      .lede {
        color: var(--muted);
        text-wrap: balance;
      }
      .retry {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-width: 168px;
        min-height: 48px;
        margin-top: 28px;
        padding: 0 28px;
        border: 1px solid var(--gold-edge);
        border-radius: 999px;
        /* The app's primary button (packages/ui button.module.css): pressed
           metal, a light face over the fill, a rim that carries the contrast
           on paper, and an inner top highlight. Lighter on hover, not darker. */
        background-color: var(--gold);
        background-image: linear-gradient(
          180deg,
          color-mix(in srgb, #fff 14%, var(--gold-lift)),
          var(--gold) 62%
        );
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.42),
          0 1px 2px rgba(240, 180, 60, 0.3);
        color: var(--on-gold);
        font-weight: 600;
        text-decoration: none;
        transition:
          background-color 120ms ease,
          box-shadow 120ms ease,
          transform 120ms ease;
      }
      .retry:hover {
        background-color: var(--gold-hover);
        background-image: linear-gradient(
          180deg,
          color-mix(in srgb, #fff 26%, var(--gold-hover)),
          var(--gold-hover) 62%
        );
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.48),
          0 6px 20px rgba(240, 180, 60, 0.38);
      }
      .retry:active {
        transform: scale(0.98);
      }
      .retry:focus-visible {
        outline: 3px solid var(--text);
        outline-offset: 3px;
      }
      .retry[aria-busy="true"] {
        pointer-events: none;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 24px;
        margin-top: 16px;
        color: var(--muted);
        font-size: 0.875rem;
      }
      .status[hidden] {
        display: none;
      }
      /* Transform only: an animated opacity on text fails contrast scans mid-frame. */
      .dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--gold);
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          transform: scale(0.55);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot {
          animation: none;
        }
        .retry {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">
        <svg width="72" height="72" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <rect x="1" y="1" width="62" height="62" rx="17" fill="#E6B24A" />
          <g transform="translate(-2.25 0)">
            <path
              d="M13 16h10c9 0 16 7 16 16s-7 16-16 16H13V16Zm7 7v18h3a9 9 0 0 0 0-18h-3Z"
              fill="#0B1018"
            />
            <path d="M23 44h5v4h-5z" fill="#0B1018" />
            <path
              d="M30 48 43 16h7L37 48h-7Z"
              fill="#E6B24A"
              stroke="#E6B24A"
              stroke-width="5"
              stroke-linejoin="round"
            />
            <path d="M30 48 43 16h7L37 48h-7Z" fill="#0B1018" />
            <path d="m46.5 24 9 24h-7l-2-6h-8l3-7h3l-1.5-4 3.5-7Z" fill="#0B1018" />
          </g>
        </svg>
        <span class="badge" aria-hidden="true">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.25"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 20h.01" />
            <path d="M8.5 16.43a5 5 0 0 1 7 0" />
            <path d="M5 12.86a10 10 0 0 1 5.17-2.69" />
            <path d="M19 12.86a10 10 0 0 0-2-1.52" />
            <path d="M2 8.82a15 15 0 0 1 4.18-2.64" />
            <path d="M22 8.82a15 15 0 0 0-11.29-3.76" />
            <path d="m2 2 20 20" />
          </svg>
        </span>
      </div>
      <h1>You’re offline</h1>
      <p class="lede">
        Check your mobile data or Wi&#8209;Fi. This page opens by itself when you’re back.
      </p>
      <a class="retry" id="retry" href="">Try again</a>
      <p class="status" id="status" role="status" hidden>
        <span class="dot" aria-hidden="true"></span>
        <span id="status-text">Waiting for a connection</span>
      </p>
    </main>
    <script>
      (function () {
        var retry = document.getElementById("retry");
        var status = document.getElementById("status");
        var statusText = document.getElementById("status-text");
        var checking = false;
        var timer = 0;
        var delay = 5000;
        status.hidden = false;

        function say(text) {
          if (statusText.textContent !== text) {
            statusText.textContent = text;
          }
        }

        // Reachable means the SERVER answered, not merely that a network exists.
        function reachable() {
          return fetch("/healthz", { cache: "no-store" }).then(
            function (response) {
              return response.ok;
            },
            function () {
              return false;
            },
          );
        }

        function schedule() {
          clearTimeout(timer);
          if (document.visibilityState === "visible") {
            timer = setTimeout(function () {
              check(false);
            }, delay);
            delay = Math.min(delay * 2, 30000);
          }
        }

        function check(asked) {
          if (checking) {
            return;
          }
          checking = true;
          clearTimeout(timer);
          if (asked) {
            retry.setAttribute("aria-busy", "true");
            retry.textContent = "Checking…";
          }
          reachable().then(function (ok) {
            if (ok) {
              say("Back online. Opening…");
              location.reload();
              return;
            }
            checking = false;
            if (asked) {
              retry.removeAttribute("aria-busy");
              retry.textContent = "Try again";
              say("Still no connection. We’ll keep trying.");
              delay = 5000;
            }
            schedule();
          });
        }

        retry.addEventListener("click", function (event) {
          event.preventDefault();
          check(true);
        });
        addEventListener("online", function () {
          delay = 5000;
          check(false);
        });
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") {
            delay = 5000;
            check(false);
          } else {
            clearTimeout(timer);
          }
        });
        schedule();
      })();
    </script>
  </body>
</html>
