<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DesiAuction mark">
  <!-- Three rising bars: climbing bids / cricket stumps. Module: 9-unit rounded bar. -->
  <g fill="#CDF53C">
    <rect x="7" y="39" width="9" height="18" rx="4.5"/>
    <rect x="19.5" y="30" width="9" height="27" rx="4.5"/>
    <rect x="32" y="21" width="9" height="36" rx="4.5"/>
    <!-- The gavel: the same bar, swung 45 degrees, plus a handle. -->
    <g transform="translate(47 14) rotate(-45)">
      <rect x="3.5" y="-1.9" width="13" height="3.8" rx="1.9"/>
      <rect x="-4.5" y="-9" width="9" height="18" rx="4.5"/>
    </g>
  </g>
  <!-- Ceremony-gold spark: the sold moment. -->
  <path fill="#F0B429" d="M40 13.4 L41.1 15.9 L43.6 17 L41.1 18.1 L40 20.6 L38.9 18.1 L36.4 17 L38.9 15.9 Z"/>
</svg>
