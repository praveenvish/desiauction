# FinOps runner on Fly Mumbai — one machine per environment (engine precedent,
# PRP-1 §2). App name is passed by the deploy workflow (--app); this file holds
# the shape. No http_service: the runner serves nothing — killing it at any
# instant loses nothing (leases expire, cursors resume, job keys absorb
# re-fires), so a restart IS the health remedy. The finops supervisor
# (superviseOperations) is the source of truth for runner liveness.
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

# PX-8 · FINOPS_STORAGE_DIR — the artifact + outbox root. The runner GENERATES
# the export artifacts the WEB tier verifies, so both must resolve the SAME
# store. Its default is a repo-relative path, which is correct for one host and
# WRONG here: web and the runner are separate machines with separate disks, so a
# filesystem root makes `verifyExport` fail and the ops board report a permanent,
# false "exports failed". Production MUST supply the shared S3-compatible
# ArtifactStorePort (IP-6 freeze §pre-deploy; RUNBOOKS §artifact digest mismatch).

[[restart]]
  policy = "always"

[[vm]]
  size = "shared-cpu-1x"
