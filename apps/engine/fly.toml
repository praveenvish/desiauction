# Engine on Fly Mumbai — one machine per environment (IP-0_DESIGN §9, §13).
# App name is passed by the deploy workflow (--app); this file holds the shape.
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  method = "GET"
  path = "/healthz"
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"

# Routing gate (PRR P2): /readyz reflects DB reachability + a live watchdog tick,
# so Fly stops sending commands to an engine that cannot serve a correct snapshot
# (mid-replay, or DB unreachable) without killing it — /healthz above is the
# liveness/watchdog check that must NOT depend on the DB (PRR F45).
[[http_service.checks]]
  method = "GET"
  path = "/readyz"
  interval = "10s"
  timeout = "5s"
  grace_period = "20s"
