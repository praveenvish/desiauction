# Engine on Fly Mumbai — one machine per environment (IP-0_DESIGN §9, §13).
# App name is passed by the deploy workflow (--app); this file holds the shape.
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  method = "GET"
  path = "/healthz"
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
