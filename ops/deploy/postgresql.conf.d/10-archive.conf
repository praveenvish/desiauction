# WAL ARCHIVING — deliberately NOT on the postgres command line.
#
# The compose file used to pass these as `-c` flags, and that cannot work on a
# first boot. The postgres entrypoint starts a TEMPORARY server to run initdb
# using those same flags, and then stops it. With archive_mode=on and a stanza
# that does not exist yet, the shutdown waits forever for WAL that can never be
# archived: "server does not shut down", and the container never becomes
# healthy. Measured on the real image before this file existed.
#
# Loaded through include_dir instead, which the init script adds to
# postgresql.conf AFTER initdb — so the temp server runs without archiving and
# the real server starts with it.
archive_mode = on
archive_command = 'pgbackrest --stanza=desiauction archive-push %p'

# THE KEEPALIVES ARE NOT OPTIONAL. A connection severed without a close — a VM
# restart, a network partition — leaves the engine's single-writer advisory lock
# held by a backend nobody is using, and every replacement engine refuses to
# boot. Observed idle for four hours once. With these, a severed holder is
# reaped in ~60s; without them, never.
tcp_keepalives_idle = 30
tcp_keepalives_interval = 10
tcp_keepalives_count = 3

wal_level = replica
