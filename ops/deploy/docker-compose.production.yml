# ONE DESIAUCTION ENVIRONMENT — production or staging — on a shared host.
#
# Deployed to /srv/apps/desiauction/<env> as Compose project `da-prod` or
# `da-staging` (COMPOSE_PROJECT_NAME in that directory's .env). Three app
# containers, Postgres with a backup sidecar, object storage with an off-box
# mirror, and a scheduler for the web tier's job routes. TLS, logs, alerts and
# autoheal are the host's shared layer (ops/platform), not this file's.
#
# ISOLATION BETWEEN ENVIRONMENTS. Each stack has its own private network,
# database, object store, volumes and env files. Web, engine and minio also
# join this stack's OWN `public` network (`da-prod-public`), which the edge
# Caddy is connected to and nothing else is. Why not one network shared by
# every stack: Docker registers each service's plain name (`engine`) on every
# network it joins, and the web tier calls the engine server-side at
# ENGINE_URL=http://engine:4000 — on a shared network production's web could
# resolve STAGING's engine. Here the only thing both stacks can see is Caddy,
# and Caddy addresses them by project-qualified alias (`da-prod-web`).
#
# SIZED BY ENV, NOT BY EDIT. Every service has a memory and CPU ceiling read
# from .env with the PRODUCTION value as the default; staging's .env sets
# smaller ones. Moving capacity between stacks is an .env change and
# `docker compose up -d`. The ceilings are what stop a staging load test (or
# another project) from starving an auction. Images are BUILT IN CI and
# pulled here — never built on the production host: the Next.js build peaks at
# 4-8 GB, and a box sized for that is a box you are paying for around the clock
# to use for ten minutes a week.
#
# Everything is pinned. `postgres:17-alpine` and not `:latest`, because a
# database that silently majors on a `docker compose pull` is a data-loss
# event, not an upgrade.
# EVERY CONTAINER'S LOGS ARE CAPPED. Docker's default `json-file` driver has NO
# size limit, so container logs grow until the disk is gone — the same ending as
# the WAL bug, by a slower road, and with no warning either. Three files of 20MB
# per service is roughly a week of an auction season's chatter and at most
# ~500MB across the stack.
#
# `<<: *logs` on each service below. Changing the policy is one edit here, not
# eight, which is the only reason it will still be right in a year.
x-logs: &logs
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

services:
  web:
    image: ${REGISTRY}/web:${TAG}
    <<: *logs
    networks:
      default: {}
      public:
        aliases: ["${COMPOSE_PROJECT_NAME}-web"]
    deploy:
      resources:
        limits: { memory: "${WEB_MEM:-1536m}", cpus: "${WEB_CPUS:-2.0}" }
    restart: unless-stopped
    env_file: [./web.env]
    labels: [autoheal=true]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      # /readyz reflects DB reachability, not just "the process is up" (PRR P2).
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  engine:
    image: ${REGISTRY}/engine:${TAG}
    <<: *logs
    networks:
      default: {}
      public:
        aliases: ["${COMPOSE_PROJECT_NAME}-engine"]
    restart: unless-stopped
    env_file: [./engine.env]
    labels: [autoheal=true]
    depends_on:
      db: { condition: service_healthy }
    # EXACTLY ONE. The engine is the single mutation authority and claims a
    # Postgres advisory lock at boot; a second instance refuses to start by
    # design. Scaling this is not a capacity lever, it is a crash loop.
    deploy:
      replicas: 1
      resources:
        limits: { memory: "${ENGINE_MEM:-768m}", cpus: "${ENGINE_CPUS:-1.5}" }
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  runner:
    image: ${REGISTRY}/finops-runner:${TAG}
    <<: *logs
    deploy:
      resources:
        limits: { memory: "${RUNNER_MEM:-512m}", cpus: "${RUNNER_CPUS:-1.0}" }
    restart: unless-stopped
    env_file: [./runner.env]
    depends_on:
      db: { condition: service_healthy }

  # THE WEB TIER'S JOB ROUTES, ON A CLOCK (ops/deploy/jobs/scheduler.mjs).
  #
  # `/api/jobs/{messages,settlement-coordination,demo-reminders,feedback}` are
  # doors a scheduler calls, and nothing on this host called them: the outbox
  # never drained after a restart, the retention purge never purged, and the
  # settlement catch-up sweep never swept. Every one is fail-closed and
  # idempotent, so an unscheduled door was indistinguishable from a quiet one.
  #
  # The WEB image, running a script from a read-only mount: its own node, no
  # third-party image to pin, and web.env as the ONE source of the job secrets —
  # a second copy is how a sender and a route come to disagree, and a
  # disagreement here is a 404 that looks like "nothing to do".
  scheduler:
    image: ${REGISTRY}/web:${TAG}
    <<: *logs
    deploy:
      resources:
        limits: { memory: "${SCHEDULER_MEM:-192m}", cpus: "0.25" }
    restart: unless-stopped
    env_file: [./web.env]
    command: ["/etc/desiauction/scheduler.mjs"]
    volumes:
      - ./jobs/scheduler.mjs:/etc/desiauction/scheduler.mjs:ro
    depends_on:
      web: { condition: service_healthy }

  # DEPLOY-TIME DATABASE WORK, RUN ON THIS HOST (deploy-host.yml).
  #
  # Migrations, the live-auction freeze check, the grant drift gate and the
  # production preflight all need the database, and the database publishes no
  # port — deliberately. They used to run from a GitHub-hosted runner against a
  # `PRODUCTION_DATABASE_URL` that could not be reached, which is to say they
  # could not run at all. Now the deploy job SSHes here and runs them in this
  # container, on the compose network, before any serving container is swapped.
  #
  # Profile `ops`: never started by `docker compose up`, only by an explicit
  # `docker compose --profile ops run --rm migrator …`. migrator.env holds ONE
  # value, DATABASE_URL as the database OWNER (the role migrations need), e.g.
  # postgres://postgres:<POSTGRES_PASSWORD>@db:5432/<POSTGRES_DB>. The
  # preflight reads the service env files through the read-only mount.
  migrator:
    image: ${REGISTRY}/migrator:${TAG}
    <<: *logs
    deploy:
      resources:
        limits: { memory: "1g", cpus: "1.0" }
    profiles: [ops]
    env_file: [./migrator.env]
    volumes:
      - ./web.env:/env/web.env:ro
      - ./engine.env:/env/engine.env:ro
      - ./runner.env:/env/runner.env:ro
    depends_on:
      db: { condition: service_healthy }

  # OBJECT STORAGE, ON THIS BOX. Player photos and finops artifacts need a
  # store both the web tier and the runner can reach, and the adapters written
  # for them speak S3 — so the cheapest correct answer is an S3 server here
  # rather than a second application path. No third party, no per-GB bill.
  #
  # WHY NOT THE FILESYSTEM. Two separate reasons, and only one of them is about
  # topology. The finops store could work on one box with a shared volume. The
  # MEDIA store cannot: `LocalStorage` writes into `public/_media` and serves it
  # as a static path, but `public/` is baked at BUILD time, so a built server
  # never serves what was written there at runtime. Uploads would land on disk
  # and every photo would 404.
  #
  # PINNED BY DIGEST, not by tag. MinIO publishes only `RELEASE.<timestamp>`
  # tags and `latest`, and `latest` is a moving target on a service that holds
  # data. The digest is immutable — the same argument the file already makes
  # for `postgres:17-alpine` over `:latest`, taken one step further because
  # there is no stable tag to take instead.
  minio:
    # SILO, NOT UPSTREAM MINIO. MinIO withdrew every public image: Docker Hub
    # first (404 as of 2026-09-18), then quay.io, which now answers every
    # anonymous pull with 401 — the digests pinned here before are unreachable
    # from anywhere, so a fresh host could not start this service at all.
    # pgsty/silo is the community-maintained fork (AGPL-3.0, CVE backports) and
    # a drop-in: same S3 API, MINIO_* env, `server /data`, `mc ready`, health
    # routes and on-disk format — so the service and volume keep their names.
    # Verified against the exact minio-init script below; see DEPLOYMENT.md.
    image: pgsty/silo@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 # RELEASE.2026-09-16T00-00-00Z
    <<: *logs
    networks:
      default: {}
      public:
        aliases: ["${COMPOSE_PROJECT_NAME}-minio"]
    deploy:
      resources:
        limits: { memory: "${MINIO_MEM:-512m}", cpus: "${MINIO_CPUS:-1.0}" }
    restart: unless-stopped
    # NO PUBLISHED PORTS. Caddy is the only way in, so the console and the
    # admin API are not exposed to the internet by an open firewall rule.
    command: ["server", "/data"]
    env_file: [./minio.env]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Creates the two buckets and sets the ONE policy that differs between them.
  # Runs to completion and exits; `docker compose up` re-runs it on every deploy
  # and every step is idempotent.
  minio-init:
    image: pgsty/mc@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd # RELEASE.2026-09-16T00-00-00Z (Silo's mc; see the minio service)
    <<: *logs
    deploy:
      resources:
        limits: { memory: "128m", cpus: "0.25" }
    env_file: [./minio.env]
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/desiauction-media
        mc mb --ignore-existing local/desiauction-finops
        mc mb --ignore-existing local/desiauction-backup
        # THE MEDIA BUCKET IS PUBLICLY READABLE AND THE FINOPS BUCKET IS NOT.
        # A player photo is served straight to a browser from MEDIA_PUBLIC_BASE,
        # so anonymous GET is what makes it work. A finops artifact is a receipt
        # register — it is reached only through a signed URL the web tier mints,
        # and anonymous access to it would be a disclosure of somebody's money.
        #
        # GetObject ONLY, AND THAT IS THE WHOLE REASON THIS IS A POLICY DOCUMENT
        # RATHER THAN `mc anonymous set download`. The shorthand grants
        # ListBucket as well, which was verified against a real MinIO: an
        # anonymous `GET /desiauction-media/?list-type=2` returned every key in
        # the bucket. Photo keys carry the org and the subject id, so that is an
        # enumeration of every club, every player and every photo on the
        # platform — including the minors whose photos the product deliberately
        # suppresses on its public pages. Reading a key you already know is the
        # capability we want; discovering the keys is not.
        cat > /tmp/media-policy.json <<'POLICY'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": { "AWS": ["*"] },
              "Action": ["s3:GetObject"],
              "Resource": ["arn:aws:s3:::desiauction-media/*"]
            }
          ]
        }
        POLICY
        mc anonymous set-json /tmp/media-policy.json local/desiauction-media
        mc anonymous set none local/desiauction-finops
        # The WAL archive. Anonymous access here would be the whole database.
        mc anonymous set none local/desiauction-backup
        echo "buckets ready"

  db:
    # BUILT, not pulled from Docker Hub, for one reason: `archive_command` runs
    # inside THIS container and `postgres:17-alpine` has no pgbackrest. Every
    # segment failed with exit code 127, and Postgres does not recycle a WAL
    # segment until it is archived — so the symptom is not "no backups", it is a
    # disk that fills until the database stops accepting writes.
    image: ${REGISTRY}/db:${DB_TAG}
    <<: *logs
    # TUNED FOR THE CONTAINER IT RUNS IN. Stock Postgres assumes a 128MB
    # machine: shared_buffers 128MB on a host with gigabytes to spare means
    # nearly every read goes through the kernel instead of Postgres's own
    # cache. The values below are the production defaults, sized to DB_MEM
    # (shared_buffers ~25%, effective_cache_size ~75% — a planner hint, not an
    # allocation); staging's .env shrinks them with DB_MEM. random_page_cost
    # and effective_io_concurrency describe NVMe, not spinning disk.
    #
    # Command-line flags are safe for THESE settings — unlike the archive
    # settings, which deadlock initdb's temporary server (10-archive.conf).
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-2GB}
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    # Docker's default /dev/shm is 64MB, and Postgres uses it for parallel
    # query and hash joins: past that, queries fail with "could not resize
    # shared memory segment" rather than slowing down.
    shm_size: ${PG_SHM_SIZE:-1g}
    # Stop gracefully: a checkpoint on a busy database takes longer than
    # Docker's default 10s, and SIGKILL after 10s means crash recovery on boot.
    stop_grace_period: 60s
    deploy:
      resources:
        limits: { memory: "${DB_MEM:-4g}", cpus: "${DB_CPUS:-2.0}" }
    restart: unless-stopped
    # pgbackrest.env is read by the database too, not just the sidecar, because
    # the archive command is a pgbackrest client and needs the same repo.
    env_file: [./db.env, ./pgbackrest.env]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgresql.conf.d:/etc/postgresql/conf.d:ro
      # Shared with the pgbackrest sidecar. pgBackRest is a LOCAL tool: it reads
      # PGDATA directly and talks to the cluster over libpq, so a sidecar that
      # has the data directory but no socket fails with "unable to find primary
      # cluster". Sharing the socket is what makes it a peer rather than a
      # stranger holding a copy of the files.
      - pgsocket:/var/run/postgresql
    # Archive settings live in conf.d, NOT here — see 10-archive.conf. Passing
    # them as `-c` flags deadlocks the first boot.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PITR. Migrations here are FORWARD-ONLY — there are no down migrations and
  # there never have been — so a restore point is the only thing that can undo
  # one.
  #
  # THE REPO BELONGS OFF THIS BOX. pgbackrest.env points repo1 at an S3 bucket
  # (PGBACKREST_REPO1_S3_ENDPOINT/BUCKET/KEY/KEY_SECRET) and the same file is
  # read by `db`, whose archive_command pushes WAL there. A repo on the MinIO
  # beside the database protects a bad migration and NOT the loss of the
  # machine — the backups die with the disk they back up. So the sidecar
  # REFUSES to run against the on-box MinIO unless PGBACKREST_ALLOW_ONBOX_REPO=1
  # says, in writing, that this is an interim state (README "Backups").
  #
  # LOUD FAILURE. The loop used to end every command in `|| true`: a backup that
  # failed every night logged one line and looked identical to one that worked.
  # Now each run logs BACKUP_OK or BACKUP_FAILED (Grafana alerts on both — the
  # failure, and the absence of success for 26h), and a failed run retries in
  # an hour instead of waiting a day.
  pgbackrest:
    image: ${REGISTRY}/db:${DB_TAG}
    <<: *logs
    deploy:
      resources:
        limits: { memory: "${PGBACKREST_MEM:-512m}", cpus: "1.0" }
    restart: unless-stopped
    env_file: [./pgbackrest.env]
    environment:
      # The on-box endpoint, so the refusal below can recognise it.
      ONBOX_S3_DOMAIN: ${S3_DOMAIN}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgsocket:/var/run/postgresql
    depends_on:
      db: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        ENDPOINT="$${PGBACKREST_REPO1_S3_ENDPOINT:-}"
        case "$$ENDPOINT" in
          "" | "$$ONBOX_S3_DOMAIN" | minio | minio:* | localhost* | 127.*)
            if [ "$${PGBACKREST_ALLOW_ONBOX_REPO:-0}" != "1" ]; then
              echo "BACKUP_REFUSED repo1 endpoint '$$ENDPOINT' is ON THIS BOX (or unset)."
              echo "A backup on the disk it backs up does not survive losing that disk."
              echo "Point PGBACKREST_REPO1_S3_* in pgbackrest.env at an off-box bucket,"
              echo "or set PGBACKREST_ALLOW_ONBOX_REPO=1 to accept an on-box repo for now."
              exit 1
            fi
            echo "WARNING repo1 is ON THIS BOX (PGBACKREST_ALLOW_ONBOX_REPO=1): recoverable from a bad migration, NOT from losing the machine."
            ;;
        esac
        # stanza-create IS idempotent on its own — on an existing, matching
        # stanza it succeeds and changes nothing — so it needs no `|| true`.
        # The `|| true` that used to be here hid the failures that matter: a
        # repo that cannot be reached, and a stanza that no longer matches this
        # cluster (a restored or re-initialised PGDATA), where continuing would
        # archive into a history that is not this database's.
        su postgres -c "pgbackrest --stanza=desiauction stanza-create"
        su postgres -c "pgbackrest --stanza=desiauction check"
        while true; do
          # Sunday a full, otherwise a differential. Retention is set in
          # pgbackrest.env; without it the repo grows until the disk is gone,
          # which is the same ending as no backup by a slower road.
          if [ "$$(date +%u)" = "7" ]; then TYPE=full; else TYPE=diff; fi
          if su postgres -c "pgbackrest --stanza=desiauction backup --type=$$TYPE"; then
            echo "BACKUP_OK type=$$TYPE"
            sleep 86400
          else
            echo "BACKUP_FAILED type=$$TYPE — retrying in 1h"
            sleep 3600
          fi
        done

  # OBJECT STORAGE, COPIED OFF THIS BOX.
  #
  # pgBackRest covers Postgres and nothing else, so `minio_data` — every player
  # photo and every finops artifact, which are FINANCIAL RECORDS — lived only on
  # this disk. This mirrors both buckets to an off-box S3 target on a timer.
  #
  #   finops: never deletes at the target. Artifacts are append-only records; a
  #           delete on this box (a bug, an operator, an attacker) must not
  #           propagate to the only other copy.
  #   media:  `--remove` DOES propagate deletes, because a photo is deleted here
  #           for an erasure or a take-down, and a backup that keeps an erased
  #           minor's photo for ever is its own DPDP problem. Point-in-time
  #           recovery for media is the target bucket's versioning, not this.
  #
  # mirror.env: MIRROR_S3_ENDPOINT (https://…), MIRROR_S3_ACCESS_KEY,
  # MIRROR_S3_SECRET_KEY, MIRROR_MEDIA_BUCKET, MIRROR_FINOPS_BUCKET, optional
  # MIRROR_INTERVAL_SECONDS (default 3600). Unconfigured is a refusal, not a
  # silent no-op, for the same reason as the pgbackrest repo above. Each pass
  # logs MIRROR_OK or MIRROR_FAILED; Grafana alerts on both.
  minio-mirror:
    image: pgsty/mc@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd # RELEASE.2026-09-16T00-00-00Z (Silo's mc; see the minio service)
    <<: *logs
    deploy:
      resources:
        limits: { memory: "256m", cpus: "0.5" }
    restart: unless-stopped
    env_file: [./minio.env, ./mirror.env]
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        for v in MIRROR_S3_ENDPOINT MIRROR_S3_ACCESS_KEY MIRROR_S3_SECRET_KEY MIRROR_MEDIA_BUCKET MIRROR_FINOPS_BUCKET; do
          eval "val=\$${$$v:-}"
          if [ -z "$$val" ]; then
            echo "MIRROR_REFUSED $$v is unset in mirror.env — object storage has NO off-box copy."
            exit 1
          fi
        done
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc alias set offbox "$$MIRROR_S3_ENDPOINT" "$$MIRROR_S3_ACCESS_KEY" "$$MIRROR_S3_SECRET_KEY" >/dev/null
        while true; do
          if mc mirror --overwrite local/desiauction-finops "offbox/$$MIRROR_FINOPS_BUCKET" \
            && mc mirror --overwrite --remove local/desiauction-media "offbox/$$MIRROR_MEDIA_BUCKET"; then
            echo "MIRROR_OK"
          else
            echo "MIRROR_FAILED — retrying next interval"
          fi
          sleep "$${MIRROR_INTERVAL_SECONDS:-3600}"
        done

networks:
  # Named per stack (da-prod-public). deploy-host.yml connects the edge Caddy
  # to it; ops/platform/apply.sh reconnects every *-public network whenever
  # Caddy is recreated.
  public:
    name: ${COMPOSE_PROJECT_NAME}-public

volumes:
  pgdata:
  pgsocket:
  minio_data:
