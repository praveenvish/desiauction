# The whole platform on one host (DEPLOYMENT.md topology).
#
# Three app containers, a reverse proxy that terminates TLS, Postgres, and a
# backup sidecar. Images are BUILT IN CI and pulled here — never built on the
# production host: the Next.js build peaks at 4-8 GB, and a box sized for that
# is a box you are paying for around the clock to use for ten minutes a week.
#
# Everything is pinned. `postgres:17-alpine` and not `:latest`, because a
# database that silently majors on a `docker compose pull` is a data-loss
# event, not an upgrade.
# EVERY CONTAINER'S LOGS ARE CAPPED. Docker's default `json-file` driver has NO
# size limit, so container logs grow until the disk is gone — the same ending as
# the WAL bug, by a slower road, and with no warning either. Three files of 20MB
# per service is roughly a week of an auction season's chatter and at most
# ~500MB across the stack.
#
# `<<: *logs` on each service below. Changing the policy is one edit here, not
# eight, which is the only reason it will still be right in a year.
x-logs: &logs
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    <<: *logs
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # ACME account + certificates; losing this re-issues
      - caddy_config:/config
    depends_on: [web, engine, minio]

  web:
    image: ${REGISTRY}/web:${TAG}
    <<: *logs
    restart: unless-stopped
    env_file: [./web.env]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      # /readyz reflects DB reachability, not just "the process is up" (PRR P2).
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  engine:
    image: ${REGISTRY}/engine:${TAG}
    <<: *logs
    restart: unless-stopped
    env_file: [./engine.env]
    depends_on:
      db: { condition: service_healthy }
    # EXACTLY ONE. The engine is the single mutation authority and claims a
    # Postgres advisory lock at boot; a second instance refuses to start by
    # design. Scaling this is not a capacity lever, it is a crash loop.
    deploy:
      replicas: 1
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  runner:
    image: ${REGISTRY}/finops-runner:${TAG}
    <<: *logs
    restart: unless-stopped
    env_file: [./runner.env]
    depends_on:
      db: { condition: service_healthy }

  # OBJECT STORAGE, ON THIS BOX. Player photos and finops artifacts need a
  # store both the web tier and the runner can reach, and the adapters written
  # for them speak S3 — so the cheapest correct answer is an S3 server here
  # rather than a second application path. No third party, no per-GB bill.
  #
  # WHY NOT THE FILESYSTEM. Two separate reasons, and only one of them is about
  # topology. The finops store could work on one box with a shared volume. The
  # MEDIA store cannot: `LocalStorage` writes into `public/_media` and serves it
  # as a static path, but `public/` is baked at BUILD time, so a built server
  # never serves what was written there at runtime. Uploads would land on disk
  # and every photo would 404.
  #
  # PINNED BY DIGEST, not by tag. MinIO publishes only `RELEASE.<timestamp>`
  # tags and `latest`, and `latest` is a moving target on a service that holds
  # data. The digest is immutable — the same argument the file already makes
  # for `postgres:17-alpine` over `:latest`, taken one step further because
  # there is no stable tag to take instead.
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    <<: *logs
    restart: unless-stopped
    # NO PUBLISHED PORTS. Caddy is the only way in, so the console and the
    # admin API are not exposed to the internet by an open firewall rule.
    command: ["server", "/data"]
    env_file: [./minio.env]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Creates the two buckets and sets the ONE policy that differs between them.
  # Runs to completion and exits; `docker compose up` re-runs it on every deploy
  # and every step is idempotent.
  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    <<: *logs
    env_file: [./minio.env]
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/desiauction-media
        mc mb --ignore-existing local/desiauction-finops
        mc mb --ignore-existing local/desiauction-backup
        # THE MEDIA BUCKET IS PUBLICLY READABLE AND THE FINOPS BUCKET IS NOT.
        # A player photo is served straight to a browser from MEDIA_PUBLIC_BASE,
        # so anonymous GET is what makes it work. A finops artifact is a receipt
        # register — it is reached only through a signed URL the web tier mints,
        # and anonymous access to it would be a disclosure of somebody's money.
        #
        # GetObject ONLY, AND THAT IS THE WHOLE REASON THIS IS A POLICY DOCUMENT
        # RATHER THAN `mc anonymous set download`. The shorthand grants
        # ListBucket as well, which was verified against a real MinIO: an
        # anonymous `GET /desiauction-media/?list-type=2` returned every key in
        # the bucket. Photo keys carry the org and the subject id, so that is an
        # enumeration of every club, every player and every photo on the
        # platform — including the minors whose photos the product deliberately
        # suppresses on its public pages. Reading a key you already know is the
        # capability we want; discovering the keys is not.
        cat > /tmp/media-policy.json <<'POLICY'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": { "AWS": ["*"] },
              "Action": ["s3:GetObject"],
              "Resource": ["arn:aws:s3:::desiauction-media/*"]
            }
          ]
        }
        POLICY
        mc anonymous set-json /tmp/media-policy.json local/desiauction-media
        mc anonymous set none local/desiauction-finops
        # The WAL archive. Anonymous access here would be the whole database.
        mc anonymous set none local/desiauction-backup
        echo "buckets ready"

  db:
    # BUILT, not pulled from Docker Hub, for one reason: `archive_command` runs
    # inside THIS container and `postgres:17-alpine` has no pgbackrest. Every
    # segment failed with exit code 127, and Postgres does not recycle a WAL
    # segment until it is archived — so the symptom is not "no backups", it is a
    # disk that fills until the database stops accepting writes.
    image: ${REGISTRY}/db:${DB_TAG}
    <<: *logs
    restart: unless-stopped
    # pgbackrest.env is read by the database too, not just the sidecar, because
    # the archive command is a pgbackrest client and needs the same repo.
    env_file: [./db.env, ./pgbackrest.env]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgresql.conf.d:/etc/postgresql/conf.d:ro
      # Shared with the pgbackrest sidecar. pgBackRest is a LOCAL tool: it reads
      # PGDATA directly and talks to the cluster over libpq, so a sidecar that
      # has the data directory but no socket fails with "unable to find primary
      # cluster". Sharing the socket is what makes it a peer rather than a
      # stranger holding a copy of the files.
      - pgsocket:/var/run/postgresql
    # Archive settings live in conf.d, NOT here — see 10-archive.conf. Passing
    # them as `-c` flags deadlocks the first boot.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PITR. Migrations here are FORWARD-ONLY — there are no down migrations and
  # there never have been — so a restore point is the only thing that can undo
  # one.
  #
  # THE REPO IS THE MinIO ON THIS BOX, and that is a deliberate, limited choice.
  # A single-host deployment has nowhere else free to put it, so this protects
  # the failure you are most likely to actually have — a bad migration, a
  # dropped table, a bug that writes nonsense — and NOT the loss of the machine.
  # Losing the disk loses the backups with it. The README says so in those
  # words; moving repo1 off the box is a credentials change and nothing more.
  pgbackrest:
    image: ${REGISTRY}/db:${DB_TAG}
    <<: *logs
    restart: unless-stopped
    env_file: [./pgbackrest.env]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgsocket:/var/run/postgresql
    depends_on:
      db: { condition: service_healthy }
    # stanza-create is idempotent and runs on every boot, so a fresh volume
    # becomes a working repo without an operator remembering a one-off command —
    # the step most likely to be skipped is the step that makes the rest real.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        su postgres -c "pgbackrest --stanza=desiauction stanza-create" || true
        su postgres -c "pgbackrest --stanza=desiauction check"
        while true; do
          # Sunday a full, otherwise a differential. Retention is set in
          # pgbackrest.env; without it the repo grows until the disk is gone,
          # which is the same ending as no backup by a slower road.
          if [ "$$(date +%u)" = "7" ]; then TYPE=full; else TYPE=diff; fi
          su postgres -c "pgbackrest --stanza=desiauction backup --type=$$TYPE" || true
          sleep 86400
        done

  # ONE TIMELINE ACROSS EVERY SERVICE.
  #
  # `docker compose logs` was the whole story, and it answers "what did this one
  # container say" — which is the wrong question during an incident. An auction
  # breaking at 9pm is web, engine and runner interleaved, and reading three
  # scrollbacks by eye and matching timestamps is how a ten-minute diagnosis
  # becomes an hour. Everything already emits structured pino JSON; nothing was
  # collecting it.
  #
  # Loki in single-binary filesystem mode: no object store, no clustering, no
  # second database to operate. It is the smallest thing that can answer "show
  # me every service around 21:04".
  loki:
    image: grafana/loki@sha256:d70e4659623f3e109af669cae76fe2a5dd5be54e2298fe8aed380d982fbc2500
    <<: *logs
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    user: "0:0" # owns its volume; the image's default uid cannot create the dirs
    volumes:
      - ./observability/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki

  # Reads container logs and ships them to Loki with the service name attached.
  #
  # THE DOCKER SOCKET IS MOUNTED, AND THAT IS A REAL TRUST DECISION rather than
  # a detail. It is how Alloy learns which container is `web` and which is
  # `engine` — without it the labels are 64-character ids and the timeline is
  # unreadable. `:ro` limits the file node, NOT the API: anything that can talk
  # to this socket can control Docker. Alloy is therefore pinned by digest like
  # everything else here, reachable from nothing outside, and should be the
  # first thing removed if the box is ever shared with something less trusted.
  alloy:
    image: grafana/alloy@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    <<: *logs
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  # NOT EXPOSED TO THE INTERNET, deliberately. Bound to the host's loopback, so
  # it is reached with `ssh -L 3001:localhost:3001 <host>` and read at
  # http://localhost:3001. A public Grafana is another login to secure, another
  # thing to patch on a schedule, and another way into a box that serves money —
  # for a single operator an SSH tunnel is both safer and less work.
  grafana:
    image: grafana/grafana@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    <<: *logs
    restart: unless-stopped
    ports: ["127.0.0.1:3001:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
      - grafana_data:/var/lib/grafana
    depends_on: [loki]

volumes:
  pgdata:
  loki_data:
  grafana_data:
  pgsocket:
  minio_data:
  caddy_data:
  caddy_config:
