# Provisioned, not clicked. A datasource configured by hand in the UI lives in
# grafana_data and is gone the moment that volume is recreated — which is
# exactly when somebody is trying to read logs in a hurry.
apiVersion: 1
datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
