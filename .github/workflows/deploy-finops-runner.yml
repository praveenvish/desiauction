# FinOps runner deploys (engine precedent, PRP-1 §2): staging on every main
# push once the Fly account exists (§32 founder externals); production is
# manual dispatch only. No public surface — the post-deploy smoke checks the
# machine is running, not an endpoint.
name: deploy-finops-runner

on:
  push:
    branches: [main]
    paths:
      - "apps/finops-runner/**"
      - "packages/financial-operations/**"
      - "packages/db/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, production]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Fly credentials
        id: creds
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN not configured — deploy skipped (IP-0_DESIGN §32 founder externals pending)." >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      # PINNED (audit PA-1 §18). `@master` is a MUTABLE BRANCH: a compromised
      # or merely careless push to that third-party repository would run
      # arbitrary code in a job that holds FLY_API_TOKEN. A tag is the minimum;
      # a digest is better and is tracked with the rest of the action pinning.
      # THE LIVE-WINDOW FREEZE (Canon C-22, audit PA-1 §19).
      #
      # "No production deploy while any auction is LIVE; the platform knows its
      # own live windows and enforces the freeze." It knew them and enforced
      # nothing — this job went straight to `flyctl deploy`, and a deploy
      # restarts the engine. The engine is the single writer and holds every lot
      # timer, so a restart mid-auction stops the countdown in the room.
      #
      # Staging warns; production refuses. An operator with a genuine reason —
      # the engine is already broken and the deploy IS the repair — sets
      # DEPLOY_ANYWAY, which is echoed in the log so the choice is on the record.
      - name: Live-window freeze
        if: steps.creds.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DEPLOY_ANYWAY: ${{ vars.DEPLOY_ANYWAY }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "No PRODUCTION_DATABASE_URL secret — cannot check for a live auction." >> "$GITHUB_STEP_SUMMARY"
            echo "The freeze is UNENFORCED for this deploy (founder externals pending)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${{ inputs.environment || 'staging' }}" = "production" ]; then
            node scripts/check-live-window.mjs
          else
            node scripts/check-live-window.mjs --warn
          fi
      # SHA-pinned, not tag-pinned (PA-1R 5.9): this job holds FLY_API_TOKEN,
      # and it previously ran `@master` — a mutable third-party branch with a
      # deploy credential in scope.
      #
      # The first pin was `@v1.5` and it did not exist. superfly/flyctl-actions
      # tags releases WITHOUT the `v` (1.4, 1.5, 1.6); only `v1` and `v1.4`
      # carry one. Every deploy workflow failed at "Set up job" with `unable to
      # resolve action`, which is fail-closed and therefore harmless — but it
      # was invisible until a push to main ran them, because deploys do not run
      # on pull requests. A SHA cannot be mistyped into something that silently
      # resolves elsewhere, which is the other half of why it is pinned this way.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        if: steps.creds.outputs.configured == 'true'
      - name: Deploy
        if: steps.creds.outputs.configured == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP="desiauction-finops-runner-${{ inputs.environment || 'staging' }}"
          flyctl deploy --config apps/finops-runner/fly.toml --app "$APP" \
            --build-arg APP_VERSION="${GITHUB_SHA::7}" --remote-only
      - name: Post-deploy smoke
        if: steps.creds.outputs.configured == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP="desiauction-finops-runner-${{ inputs.environment || 'staging' }}"
          STATE=$(flyctl machine list --app "$APP" --json |
            node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const m=JSON.parse(d);console.log(m.length>0&&m.every(x=>x.state==="started")?"ok":"bad")})')
          if [ "$STATE" = "ok" ]; then echo "runner machines started"; exit 0; fi
          echo "runner machines not healthy"; exit 1
