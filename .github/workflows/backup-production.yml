# NIGHTLY PROOF THAT PRODUCTION BACKUPS EXIST (PA-1R Phase 7.3, go-live gate P0-1).
#
# A COMMAND that produces a backup is not the same as BACKUPS EXISTING (PA-1
# §19). This workflow used to take a `pg_dump` from this GitHub runner — and the
# production database publishes no port, deliberately, so the dump could never
# connect. Worse, when its secrets were missing it wrote "Backup skipped" to the
# summary and exited GREEN: a nightly badge that said "backups OK" on a platform
# with none. A backup job that fails quietly is worse than none, because it is
# believed.
#
# THE AUTHORITATIVE BACKUP IS ON THE HOST, and this workflow no longer pretends
# to be it. The `pgbackrest` sidecar (ops/deploy/docker-compose.production.yml)
# archives WAL continuously and takes a nightly full/differential into repo1,
# which belongs on an OFF-BOX S3 bucket (the sidecar refuses an on-box repo
# unless PGBACKREST_ALLOW_ONBOX_REPO=1). What was missing was anybody checking.
# So this job SSHes to the host and asks pgBackRest itself:
#
#   · `check`  — the repo is reachable and WAL archiving works right now;
#   · `info`   — the newest backup finished within the last 26 hours.
#
# LOUD FAILURE, both ways. Missing SSH secrets FAIL the job (exit 1) with the
# explanation in the summary — the badge must tell the truth before the
# founder externals exist, not only after. A stale or failing backup fails it
# too. It has no `continue-on-error`.
#
# The Grafana rules `da-backup-failed` / `da-backup-stale` watch the same thing
# from inside the box; this is the outside view, which still works when the box
# (and its Grafana) is the thing that is wrong.
name: backup-production

on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST, before the nightly verify
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-backups:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check the host credentials exist
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            {
              echo "### Backups NOT verified"
              echo ""
              echo "DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY are not all configured for the"
              echo "\`production\` environment, so nothing could be checked. These are founder-held"
              echo "(PRODUCTION_CHECKLIST §2)."
              echo ""
              echo "**This job fails until they exist**, on purpose: a green badge here must mean"
              echo "a backup finished in the last 26 hours, never \"nobody looked\"."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Ask pgBackRest on the host
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/desiauction
            pgb() { docker compose exec -T pgbackrest su postgres -c "pgbackrest --stanza=desiauction $*"; }

            # Repo reachable, stanza valid, and a WAL segment actually archives.
            pgb check

            # The newest backup's stop time, from pgBackRest's own JSON. No jq
            # on the host or in the image, and none is needed: the `backup`
            # array is oldest-first, so the last "stop" is the newest.
            INFO="$(pgb "info --output=json")"
            STOP="$(printf '%s' "$INFO" | grep -o '"stop":[0-9]*' | tail -1 | cut -d: -f2)"
            if [ -z "$STOP" ]; then
              echo "NO BACKUP in the repo at all — the sidecar has never completed one."
              exit 1
            fi
            AGE=$(( $(date +%s) - STOP ))
            echo "newest backup finished $(( AGE / 3600 ))h ago ($(date -u -d "@$STOP" '+%F %TZ'))"
            if [ "$AGE" -gt $(( 26 * 3600 )) ]; then
              echo "STALE: older than 26h. docker compose logs pgbackrest shows why."
              exit 1
            fi

            # Say where repo1 is, so an on-box repo is never mistaken for a
            # disaster-recovery copy (README "Backups").
            docker compose exec -T pgbackrest sh -c \
              'echo "repo1 endpoint: ${PGBACKREST_REPO1_S3_ENDPOINT:-(unset)}; on-box override: ${PGBACKREST_ALLOW_ONBOX_REPO:-0}"'

      - name: Record it
        run: |
          {
            echo "### Backups verified on the host"
            echo ""
            echo "pgBackRest \`check\` passed and the newest backup is under 26 hours old."
            echo "**A backup that has never been restored is a hope, not a backup** — the"
            echo "restore drill and its measured RTO live in docs/operations/RESTORE_RUNBOOK.md."
          } >> "$GITHUB_STEP_SUMMARY"
