# Deploy the three containers to the self-hosted host.
#
# Replaces the Fly workflows for web/engine/runner. Same discipline, different
# target: images are built HERE (never on the production box), the live-auction
# window is checked BEFORE anything is touched, and production is dispatch-only.
#
# EVERY STEP THAT NEEDS THE DATABASE RUNS ON THE HOST. The freeze check, both
# migration sets and the grant gate used to run on this GitHub runner against
# `secrets.PRODUCTION_DATABASE_URL` — and the compose database publishes no
# port, on purpose, so from here it was unreachable: the freeze check refused
# every deploy (correctly: "unreachable is not evidence the room is empty"),
# and the only way through was a database port open to the internet. They now
# run in the `migrator` image (ops/deploy/migrator), built beside the app
# images, over the same SSH session that swaps the containers.
#
# Order: CI green for this exact commit → build → [host] preflight → freeze →
# pull → migrate → grants → engine swap + /readyz → the rest + /readyz →
# publish the site file to the shared edge Caddy.
#
# ONE HOST, MANY STACKS. Each environment lives in /srv/apps/desiauction/<env>
# as Compose project da-prod or da-staging (ops/deploy/docker-compose.production.yml
# header); TLS, logs and alerts are the host's shared layer (ops/platform).
name: deploy-host

on:
  workflow_dispatch:
    inputs:
      environment:
        description: staging or production
        type: choice
        options: [staging, production]
        default: staging
      deploy_anyway:
        description: "Override the live-auction refusal (engine already broken, deploy IS the repair)"
        type: boolean
        default: false

# `packages: write` to push images, `actions: read` for the CI gate below.
permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  # Two deploys racing each other onto one host is how you get a half-swapped
  # stack. Never cancel in progress — let the first finish.
  group: deploy-host-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # --- NOTHING SHIPS THAT CI DID NOT PASS ------------------------------------
  #
  # workflow_dispatch builds whatever commit the chosen ref points at, and
  # nothing checked that commit had ever been through `ci`. A dispatch from a
  # branch with a red (or never-run) CI went to production on the operator's
  # memory. This asks the Actions API for a SUCCESSFUL `ci` run on this exact
  # sha; a run on the same branch at a different commit does not count.
  #
  # Deliberately NOT overridable, and unrelated to `deploy_anyway`: that input
  # overrides the live-auction freeze because a deploy can be the repair for a
  # broken engine. Untested code is never the repair — push the fix and let ci
  # pass on it.
  ci-green:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require a successful ci run for ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=1"
          count="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" "$url" | jq '.total_count')"
          if [ "${count:-0}" -lt 1 ]; then
            {
              echo "### Deploy refused: no green \`ci\` run for ${GITHUB_SHA::12}"
              echo ""
              echo "Every job in \`ci\` (quality, integration, e2e, images, secrets-scan)"
              echo "must have passed on THIS commit. Wait for it, or re-run it, then"
              echo "dispatch again."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "no successful ci run for ${GITHUB_SHA}" >&2
            exit 1
          fi
          echo "ci passed on ${GITHUB_SHA::12}"

  deploy:
    needs: ci-green
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Record that the freeze will be overridden
        if: ${{ inputs.deploy_anyway }}
        run: |
          echo "⚠️ The live-auction freeze is OVERRIDDEN for this deploy (deploy_anyway)." >> "$GITHUB_STEP_SUMMARY"
          echo "This is only correct when the engine is already broken and the deploy is the repair." >> "$GITHUB_STEP_SUMMARY"

      # --- Build the images ---------------------------------------------------
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          REG="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="${GITHUB_SHA::12}"
          # The web image takes one build SECRET: the key that keeps server
          # action ids the same from one release to the next (apps/web/Dockerfile
          # says why). Without it every deploy breaks the pages people already
          # have open, so its absence is announced rather than passed over.
          WEB_SECRET=""
          if [ -n "${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}" ]; then
            WEB_SECRET="--secret id=server_actions_key,env=NEXT_SERVER_ACTIONS_ENCRYPTION_KEY"
          else
            echo "::warning::NEXT_SERVER_ACTIONS_ENCRYPTION_KEY is not set for this environment — pages open during this deploy must be reloaded before their forms work again"
            echo "⚠️ No \`NEXT_SERVER_ACTIONS_ENCRYPTION_KEY\` secret for **${{ inputs.environment }}**: every page open during this deploy must be reloaded before its forms and bids work again. Add one (\`openssl rand -base64 32\`) to the environment's secrets." >> "$GITHUB_STEP_SUMMARY"
          fi
          for app in web engine finops-runner; do
            EXTRA=""
            if [ "$app" = web ]; then EXTRA="$WEB_SECRET"; fi
            # $EXTRA is unquoted on purpose: it is either empty or two words.
            # shellcheck disable=SC2086
            docker buildx build \
              --file "apps/${app}/Dockerfile" \
              --build-arg "APP_VERSION=${TAG}" \
              --tag "${REG}/${app}:${TAG}" \
              $EXTRA \
              --push .
          done
          docker buildx build \
            --file ops/deploy/migrator/Dockerfile \
            --build-arg "APP_VERSION=${TAG}" \
            --tag "${REG}/migrator:${TAG}" \
            --push .

          # THE DATABASE IMAGE IS TAGGED BY ITS OWN CONTENT, not by the commit.
          # Postgres carries pgbackrest because `archive_command` runs inside
          # that container, so it has to be built — but it must NOT be rebuilt
          # and swapped on every application deploy. `docker compose up -d` only
          # recreates a container whose image changed, so a tag derived from the
          # Dockerfile means the database is left alone until the Dockerfile
          # itself changes. Restarting Postgres on every deploy is a small
          # outage nobody asked for.
          DB_TAG="$(cat ops/deploy/db/Dockerfile ops/deploy/db/initdb/* | shasum -a 256 | cut -c1-12)"
          # BUILD IT ONCE PER CONTENT, NEVER AGAIN. A rebuild is not
          # byte-identical (layer timestamps), so pushing the same content tag
          # every deploy moved it to a NEW digest: the host's `compose pull`
          # fetched it and `up -d` recreated Postgres (and the backup sidecar)
          # on every release — a restart that cut the old engine's connection
          # mid-write ("Cannot read properties of null (reading 'write')",
          # a fatal alert) on the 2026-09-29 deploy. If the tag exists, reuse it.
          if docker buildx imagetools inspect "${REG}/db:${DB_TAG}" >/dev/null 2>&1; then
            echo "db:${DB_TAG} already in the registry — not rebuilt, Postgres stays up"
          else
            docker buildx build \
              --file ops/deploy/db/Dockerfile \
              --tag "${REG}/db:${DB_TAG}" \
              --push ops/deploy/db
          fi

          echo "REGISTRY=${REG}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "DB_TAG=${DB_TAG}" >> "$GITHUB_ENV"

      # --- The stack's files travel with the release ---------------------------
      #
      # The compose file, site template, scheduler and Postgres config are code, and a
      # host running last month's copy of them is a deploy nobody reviewed. The
      # env files are NOT in git and are never touched. Anything edited by hand
      # on the host under these names is overwritten — change it here instead.
      - name: Ship the stack definition to the host
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The host's SSH identity, pinned. Without it the action accepts
          # whatever answers at DEPLOY_HOST — a hijacked IP would receive the
          # deploy key's session and every env file the deploy touches.
          # `ssh-keygen -l -f /etc/ssh/ssh_host_ed25519_key.pub | cut -d' ' -f2`
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          source: "ops/deploy/docker-compose.production.yml,ops/deploy/site.caddy,ops/deploy/jobs,ops/deploy/postgresql.conf.d"
          target: /srv/apps/desiauction/${{ inputs.environment }}
          strip_components: 2

      # The sitemap as the OLD site serves it, so the announce step after the
      # swap can tell search engines only what this release changed
      # (scripts/indexnow-announce.mjs). Production only: it is the one host
      # with an IndexNow key. Read-only, and it can never fail a deploy.
      - name: Snapshot the sitemap before the swap
        if: ${{ inputs.environment == 'production' }}
        continue-on-error: true
        run: node scripts/indexnow-announce.mjs snapshot https://desiauction.in "$RUNNER_TEMP/sitemap-before.xml"

      # --- On the host: gate, migrate, swap, prove ---------------------------
      #
      # ORDER MATTERS AND IS FORWARD-ONLY. Migrations run before the new images
      # serve traffic, and they cannot be rolled back — the restore point
      # recorded in the deploy note is the only undo (DEPLOYMENT.md §Rollback).
      #
      # Nothing below changes what is SERVING until the migrate step: the
      # preflight and the freeze run first, and `.env` keeps the old TAG until
      # the swap begins — a refused deploy leaves the host exactly as it was,
      # so a later manual `docker compose up -d` cannot half-apply it.
      - name: Gate, migrate and swap on the host
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The host's SSH identity, pinned. Without it the action accepts
          # whatever answers at DEPLOY_HOST — a hijacked IP would receive the
          # deploy key's session and every env file the deploy touches.
          # `ssh-keygen -l -f /etc/ssh/ssh_host_ed25519_key.pub | cut -d' ' -f2`
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          command_timeout: 45m
          # THE HOST PULLS WITH THIS RUN'S OWN TOKEN. GHCR creates container
          # packages PRIVATE by default (a public repo does not change that), and
          # the host holds no registry credential — a first deploy was denied at
          # its first pull. The job's GITHUB_TOKEN can read these packages and
          # expires with the run, so nothing long-lived is left on the box; the
          # script logs out again on success and on failure.
          envs: GHCR_USER,GHCR_TOKEN
          # bash, not sh: the ERR trap (and -E, so it fires inside functions)
          # is what prints the rollback instructions on a failed swap.
          script: |
            set -Eeuo pipefail
            APP_DIR="/srv/apps/desiauction/${{ inputs.environment }}"
            cd "$APP_DIR"

            NEW_TAG="${{ env.TAG }}"
            NEW_DB_TAG="${{ env.DB_TAG }}"
            PREV_TAG="$(sed -n 's/^TAG=//p' .env)"
            STAGE=gates

            # The synced file is the stack, and the environment names the
            # Compose project; say both once so every plain `docker compose …`
            # in this directory reads the right stack under the right name.
            STACK="$([ "${{ inputs.environment }}" = production ] && echo da-prod || echo da-staging)"
            grep -q '^COMPOSE_FILE=' .env || echo 'COMPOSE_FILE=docker-compose.production.yml' >> .env
            grep -q '^COMPOSE_PROJECT_NAME=' .env || echo "COMPOSE_PROJECT_NAME=${STACK}" >> .env
            grep -qx "COMPOSE_PROJECT_NAME=${STACK}" .env \
              || { echo "${APP_DIR}/.env names a different Compose project than ${STACK}"; exit 1; }

            # The shared layer must be up: this deploy hands its hostnames to it.
            docker inspect edge-caddy >/dev/null 2>&1 \
              || { echo "edge-caddy is not running — apply ops/platform first (ops/platform/README.md)"; exit 1; }

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
            on_failure() {
              docker logout ghcr.io >/dev/null 2>&1 || true
              echo ""
              echo "DEPLOY FAILED during: ${STAGE}"
              case "$STAGE" in
                gates)
                  echo "Nothing was changed. The previous release (${PREV_TAG}) is still serving." ;;
                migrate)
                  echo "Serving containers were NOT swapped (still ${PREV_TAG}). A failed migration"
                  echo "batch rolls back as one transaction; the roles and grants steps run after"
                  echo "it has committed and are safe to re-run. Read the error above before retrying." ;;
                freeze)
                  echo "An auction went live, or came within its start window, WHILE this deploy was"
                  echo "running. Serving containers were NOT swapped (still ${PREV_TAG}) and the room"
                  echo "was not touched. Migrations for ${NEW_TAG} are applied; they are expand-only,"
                  echo "so ${PREV_TAG} keeps serving on them. Dispatch again when the auction is over." ;;
                *)
                  echo "Migrations for ${NEW_TAG} are applied. To put the previous images back:"
                  echo "  cd ${APP_DIR}"
                  echo "  sed -i 's|^TAG=.*|TAG=${PREV_TAG}|' .env && docker compose up -d"
                  echo "That is safe only if this release's migrations are expand-only —"
                  echo "DEPLOYMENT.md §Rollback decides; a destructive one means restore." ;;
              esac
            }
            trap on_failure ERR

            # Compose reads shell env before .env, so the NEW tags apply to the
            # commands below without writing them to .env yet.
            export TAG="$NEW_TAG" DB_TAG="$NEW_DB_TAG"
            ops() { docker compose --profile ops run --rm "$@"; }

            docker compose --profile ops pull migrator

            # 1. The cross-service env check, over the real env files.
            #    Blocking for production; advisory on staging, whose env is a
            #    rehearsal of production's and legitimately short of it.
            if [ "${{ inputs.environment }}" = "production" ]; then
              ops migrator preflight
            else
              ops migrator preflight || echo "preflight FAILED (staging: advisory, continuing)"
            fi

            # 2. THE C-22 FREEZE. "No production deploy while any auction is
            #    LIVE": an engine restart stops the countdown in the room. An
            #    unreachable database also refuses. deploy_anyway is the ONE
            #    override, and it is passed through explicitly so the script
            #    still names the rooms it is walking into.
            if [ "${{ inputs.deploy_anyway }}" = "true" ]; then
              ops -e DEPLOY_ANYWAY=1 migrator live-window
            else
              ops migrator live-window
            fi

            docker compose pull

            # 3. Forward-only migrations, then the four runtime roles and their
            #    grants (idempotent; the first deploy creates them), then the
            #    grant manifest against the real roles (a new table must not
            #    reach production unreadable).
            STAGE=migrate
            ops migrator migrate
            ops migrator roles
            ops migrator grants

            # 3b. ASK AGAIN, immediately before anything in the room is touched.
            #    The first answer is minutes old by now — the images were pulled
            #    and the migrations ran in between — and an organizer who
            #    pressed Start in that time would have the engine swapped under
            #    their first lot. Same script, same override, new answer.
            STAGE=freeze
            if [ "${{ inputs.deploy_anyway }}" = "true" ]; then
              ops -e DEPLOY_ANYWAY=1 migrator live-window
            else
              ops migrator live-window
            fi

            # 4. Swap. Engine first: it hands its single-writer lease back on
            #    graceful SIGTERM and the replacement claims it at once. A brief
            #    overlap is normal — the new one exits 1 and retries.
            STAGE=swap
            sed -i "s|^TAG=.*|TAG=${NEW_TAG}|" .env
            if grep -q '^DB_TAG=' .env; then
              sed -i "s|^DB_TAG=.*|DB_TAG=${NEW_DB_TAG}|" .env
            else
              echo "DB_TAG=${NEW_DB_TAG}" >> .env
            fi

            # /readyz, asked of the NEW container from inside it: it answers
            # only once the process is up AND its database is reachable. A
            # container that never gets there fails the deploy with its logs.
            wait_ready() {
              local svc="$1" port="$2" deadline=$(( $(date +%s) + $3 ))
              until docker compose exec -T "$svc" /nodejs/bin/node -e \
                "fetch('http://127.0.0.1:${port}/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" \
                >/dev/null 2>&1; do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "${svc}: /readyz not healthy after ${3}s"
                  docker compose logs --tail 60 "$svc"
                  return 1
                fi
                sleep 5
              done
              echo "${svc}: /readyz healthy"
            }

            # postgresql.conf.d was shipped above, and Postgres only reads it
            # at start or when told to. Tell it: a setting that is on disk and
            # not in the running server (archive_timeout was the case in point)
            # is a recovery objective the runbook states and nothing delivers.
            # Never fatal — a reload that cannot be sent must not stop a deploy
            # that is otherwise sound — but never silent either.
            docker compose exec -T db psql -U postgres -qAtc "select pg_reload_conf()" >/dev/null \
              || echo "WARNING: could not reload Postgres — postgresql.conf.d changes are NOT live yet"

            docker compose up -d --no-deps engine
            wait_ready engine 4000 180
            docker compose up -d
            wait_ready web 3000 180
            # No port to probe on these two; "running, not restarting" is the
            # claim that can be checked.
            sleep 10
            for svc in runner scheduler; do
              docker compose ps --status running --services | grep -qx "$svc" \
                || { echo "${svc} is not running"; docker compose logs --tail 60 "$svc"; false; }
            done

            # Hand this stack's hostnames to the shared edge. The site file is
            # rendered from the template with this stack's own .env values;
            # Caddy joins the stack's public network (idempotent) and validates
            # before it reloads — a refused reload leaves every site as it was.
            STAGE=edge
            envval() { sed -n "s/^$1=//p" .env; }
            WEB_EXTRA=""
            [ "$STACK" = da-staging ] && WEB_EXTRA='header X-Robots-Tag "noindex, nofollow"'
            sed -e "s|__STACK__|${STACK}|g" \
                -e "s|__PUBLIC_DOMAIN__|$(envval PUBLIC_DOMAIN)|g" \
                -e "s|__ENGINE_DOMAIN__|$(envval ENGINE_DOMAIN)|g" \
                -e "s|__S3_DOMAIN__|$(envval S3_DOMAIN)|g" \
                -e "s|__WEB_EXTRA__|${WEB_EXTRA}|g" \
                site.caddy > "/srv/platform/sites/${STACK}.caddy.new"
            [ "$STACK" = da-prod ] \
              || sed -i '/# prod-only:start/,/# prod-only:end/d' "/srv/platform/sites/${STACK}.caddy.new"
            SITE="/srv/platform/sites/${STACK}.caddy"
            [ -f "$SITE" ] && cp "$SITE" "${SITE}.prev"
            mv "${SITE}.new" "$SITE"
            docker network connect "${STACK}-public" edge-caddy 2>/dev/null || true
            # A site file Caddy refuses is put back at once: it sits in the
            # directory every OTHER stack's reload reads too.
            if ! docker exec edge-caddy caddy validate --config /etc/caddy/Caddyfile >/dev/null; then
              if [ -f "${SITE}.prev" ]; then mv "${SITE}.prev" "$SITE"; else rm -f "$SITE"; fi
              echo "the rendered site file failed validation; the previous one is restored"
              false
            fi
            docker exec edge-caddy caddy reload --config /etc/caddy/Caddyfile
            rm -f "${SITE}.prev"

            docker image prune -f
            # `prune -f` removes only UNTAGGED images, and every release is
            # tagged — so each deploy left four more images on the disk for
            # ever, on a host whose disk nothing was watching. Keep this
            # release and the one before it (the rollback), drop the rest.
            # Only this project's repositories: the host is shared. An image a
            # container still uses is refused by Docker, which is the right
            # answer, and nothing here can fail a deploy that has succeeded.
            prune_old_releases() {
              local registry ref
              registry="$(envval REGISTRY)"
              [ -n "$registry" ] || return 0
              for repo in web engine finops-runner migrator; do
                docker image ls --format '{{.Repository}}:{{.Tag}}' "${registry}/${repo}" \
                  | while read -r ref; do
                      case "$ref" in
                        *":${NEW_TAG}" | *":${PREV_TAG}" | *":<none>") ;;
                        *) docker image rm "$ref" >/dev/null 2>&1 || true ;;
                      esac
                    done
              done
            }
            prune_old_releases || echo "WARNING: old release images were not pruned"
            docker logout ghcr.io >/dev/null
            trap - ERR
            echo "deployed ${NEW_TAG} (previous: ${PREV_TAG})"

      # --- Tell search engines what this release changed ---------------------
      #
      # Runs only once the swap above has passed /readyz. Submits to IndexNow
      # (Bing, Yandex, Seznam, Naver) every page that is new or whose sitemap
      # <lastmod> moved, plus the homepage, whose footer and schema no page
      # date reflects. Google does not take part; it reads the sitemap.
      # Season pages are already announced by the app when they change
      # (apps/web/src/server/seo/indexnow.ts). It never fails a deploy that
      # has succeeded: the script exits 0 on every path.
      - name: Announce changed pages to IndexNow
        if: ${{ inputs.environment == 'production' }}
        continue-on-error: true
        run: node scripts/indexnow-announce.mjs announce https://desiauction.in "$RUNNER_TEMP/sitemap-before.xml"
