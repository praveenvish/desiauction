# The single quality gate (IP-0_DESIGN §20). Target: < 8 minutes.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `pnpm build` needs a database: `apps/web/src/env.ts` refuses to load
    # without DATABASE_URL, and the sitemap queries at build time. This job
    # never had one, so its build step has failed for as long as it has
    # existed — behind the unit tests, so it was rarely reached.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: desiauction
          POSTGRES_PASSWORD: desiauction
          POSTGRES_DB: desiauction
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U desiauction"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://desiauction:desiauction@localhost:5433/desiauction
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # A journal entry whose `when` is not strictly after its predecessor is
      # SKIPPED by the migrator on every database that already ran the one
      # before — green here on a fresh database, absent in production.
      - run: node packages/db/scripts/check-journal.mjs
      - run: pnpm --filter @desiauction/db db:migrate
      - run: pnpm build
      # Audit P3 F14 — THE FIRST-LOAD JS BUDGET. Every app route's gzipped
      # first-load JS, read from the build's manifests, against
      # bundle-budget.json (a default ceiling + per-route overrides, ~10% over
      # what each route weighed when set). A route that grows past its number
      # fails here; raising one is a deliberate edit to that file, in the PR
      # that grew it. The parser's own tests run first, so a manifest-shape
      # change cannot turn the check into a pass over nothing.
      - run: pnpm test:scripts
      - run: pnpm check:bundle
      # Generated tokens are committed; a rebuild must be a no-op (IP-1_DESIGN §6).
      - run: git diff --exit-code packages/ui/src/generated
      - run: pnpm format:check
      - run: pnpm depcruise
      # PRR P2/F26: `check:motion` is part of the project's own `verify` gate but
      # was missing from CI, so a motion-token regression could merge green.
      - run: pnpm check:motion
      # PA-1R Phase 0.4 — THE TENANT-POSTURE RATCHET.
      #
      # Static, needs no database, runs in a second. Every file that reaches a
      # database pool without entering `withTenantDb` must be named in
      # ops/posture-allowlist.json with a reason. A NEW bypass fails here; so
      # does an allowlist entry whose file no longer bypasses, so the list can
      # never rot into a rubber stamp. Audit PA-1 found two production defects
      # of exactly this shape (§10 P0-1, P0-2), both invisible to every other
      # gate because they only misbehave under the production roles.
      - run: pnpm check:posture
      - run: pnpm audit --prod --audit-level high

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: desiauction
          POSTGRES_PASSWORD: desiauction
          POSTGRES_DB: desiauction
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U desiauction"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://desiauction:desiauction@localhost:5433/desiauction
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every CI run proves the committed migrations apply cleanly (§20, §36).
      - run: pnpm --filter @desiauction/db db:migrate
      - run: pnpm --filter @desiauction/engine db:migrate
      - run: pnpm test:integration

      # THE PRODUCTION ROLE MODEL, PROVEN ON EVERY PR.
      #
      # Nothing here ever ran as anything but the database owner, so the
      # four-role recipe rotted twelve migrations behind the code without a
      # single test going red: the engine had no UPDATE on `registrations` (the
      # table every sale writes) and the app role had no privileges at all on
      # six newer tables. Under the documented production config the first sale
      # of the first auction deadlocked. Audited 2026-08-18 (P0-1).
      #
      # `grants:verify` asserts a declared manifest against the real roles;
      # `rls:verify` proves isolation is load-bearing under the non-BYPASSRLS
      # app role. Both are seconds, and both belong on the PR gate — not only in
      # a nightly that had never run.
      - name: Create the four production roles
        run: |
          PGPASSWORD=desiauction psql -h localhost -p 5433 -U desiauction -d desiauction \
            -v ON_ERROR_STOP=1 \
            -v app_password='ci-app' -v system_password='ci-system' \
            -v engine_password='ci-engine' -v runner_password='ci-runner' \
            -f ops/db/create-app-role.sql
      - name: Grant drift gate
        run: pnpm --filter @desiauction/web grants:verify
      # The runner's receipt delivery, run AS desiauction_runner: the gate and
      # recipient reads plus the /inbox row write, proven against the real role
      # rather than the owner the step above ran it as.
      - name: Runner delivery under the runner role
        run: pnpm --filter @desiauction/finops-runner test:integration
        env:
          RUNNER_DATABASE_URL: postgres://desiauction_runner:ci-runner@localhost:5433/desiauction
      - name: RLS probe under the non-BYPASSRLS app role
        run: pnpm --filter @desiauction/web rls:verify
        env:
          APP_DATABASE_URL: postgres://desiauction_app:ci-app@localhost:5433/desiauction

      # PA-1R Phase 0.5 — THE RUNTIME POSTURE SUITE.
      #
      # `grants:verify` proves the roles hold the grants the manifest declares,
      # and `rls:verify` proves the policies are load-bearing. Neither runs the
      # APPLICATION. This does: real route handlers, real read paths, connected
      # as `desiauction_app` and `desiauction_system` exactly as production is.
      #
      # It is the only suite in the repository that does. Every other one —
      # unit, integration, e2e — connects as the database owner, which Postgres
      # exempts from RLS, so a path that skips the tenant boundary passes all of
      # them and fails on the first real event. That blind spot is where both of
      # PA-1's P0s lived.
      #
      # Fixtures still need owner rights (creating a tenant is not a thing a
      # tenant-scoped role can do), so seeding uses OWNER_DATABASE_URL on a
      # separate connection and only the code under test runs as the app.
      - name: Application posture under the production roles
        run: pnpm --filter @desiauction/web posture:verify
        env:
          APP_DATABASE_URL: postgres://desiauction_app:ci-app@localhost:5433/desiauction
          SYSTEM_DATABASE_URL_POSTURE: postgres://desiauction_system:ci-system@localhost:5433/desiauction
          OWNER_DATABASE_URL: postgres://desiauction:desiauction@localhost:5433/desiauction

  # THE JOURNEY GATE. There was no e2e step in CI at all: the two proofs the
  # release documents lean on (end-to-end journeys and tenant isolation) were
  # both absent from the only gate that runs. It uses the PRECOMPILED server —
  # `next start` over a real build — because the on-demand dev compiler is what
  # exhausts the heap and produces restart flakes.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: desiauction
          POSTGRES_PASSWORD: desiauction
          POSTGRES_DB: desiauction
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U desiauction"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://desiauction:desiauction@localhost:5433/desiauction
      OTP_PROVIDER: dev
      PLAYWRIGHT_PRECOMPILED: "1"
      NEXT_DIST_DIR: .next-e2e
      # `next start` runs with NODE_ENV=production, which trips the apps/web boot
      # guard: OTP_PROVIDER=dev (which the suite REQUIRES, so e2e/otp.ts can read
      # codes) is refused in a serving production process. This flag is exactly
      # that escape — a production-shaped BUILD exercised in a non-production
      # CONTEXT — and without it the whole e2e job fails at web-server boot.
      ALLOW_INSECURE_LOCAL_PRODUCTION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @desiauction/db db:migrate
      - run: pnpm --filter @desiauction/engine db:migrate
      - run: pnpm seed:demo
      - name: Build the server the suite will run against
        run: pnpm --filter @desiauction/web exec next build
      - run: pnpm --filter @desiauction/web exec playwright install --with-deps chromium
      - name: End-to-end journeys
        run: pnpm --filter @desiauction/web exec playwright test
      # THE 29 THIS JOB SILENTLY SKIPS.
      #
      # `/gallery` is dev-only, so on the precompiled server the four
      # design-system specs — gallery, identity, motion, primitives — skip
      # themselves with a reason and the job still reports success. That is 28
      # tests, and they are not decorative: they are the ONLY measured proof of
      # AA contrast on both themes, of self-hosted fonts, of the 44px touch
      # rung, of focus trapping and of the polite live regions. A job that runs
      # 101 of 129 and calls itself the journey gate is the same shape of
      # problem this milestone exists to remove (PA-1R Phase 8.2).
      #
      # They need the dev compiler, so this step turns the flag off for itself.
      - name: Design-system journeys (dev server — /gallery does not exist in a build)
        env:
          PLAYWRIGHT_PRECOMPILED: ""
          # Warm only what these specs visit: the full warm list pushed this
          # dev server past its memory threshold mid-run (global-setup.ts).
          E2E_WARM_ROUTES: "/gallery,/login,/"
        run: >-
          pnpm --filter @desiauction/web exec playwright test
          e2e/gallery.spec.ts e2e/identity.spec.ts e2e/motion.spec.ts e2e/primitives.spec.ts

      # THE TWENTY-NINTH SKIP, AND THE ONE THAT IS NOT DECORATIVE.
      #
      # The step above recovered the four design-system specs the precompiled
      # run skips. It left one more behind: the player-photo journey, which
      # skips itself under PLAYWRIGHT_PRECOMPILED because `MEDIA_STORAGE=local`
      # writes into `public/`, which a built server has already baked. So the
      # ONLY end-to-end exercise of media upload — the route that mints a key,
      # the ownership check on it, the byte-sniffing content check, and the
      # attach that writes the row — ran in no job at all.
      #
      # That is not a theoretical gap: `api/media/upload/route.ts` carries a
      # comment about a 403 that killed every self-registered player photo under
      # the default storage mode, found by a person because "the e2e suite covers
      # the ORGANIZER's photo import, whose actor is a member, so nothing went
      # red". Selected by title so the rest of the file is not run twice.
      - name: Player photo journey (dev server — local media is written after a build)
        env:
          PLAYWRIGHT_PRECOMPILED: ""
          # The pages this one test walks. Warming the whole suite's list made
          # the dev server restart under it — the "flake" at a different step
          # each run (global-setup.ts, E2E_WARM_ROUTES).
          E2E_WARM_ROUTES: "/login,/onboarding,/home,/orgs,/org/warmup,/seasons,/tournaments,/seasons/warmup,/seasons/warmup/registrations"
        run: >-
          pnpm --filter @desiauction/web exec playwright test e2e/registration-ops.spec.ts
          -g "imports their photo by filename"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7

  # EVERY IMAGE THE HOST PULLS, BUILT ON EVERY PR (no push).
  #
  # Nothing built the images until a deploy did, so a Dockerfile could rot
  # behind a green main. It did: the lockfile gained `patchedDependencies` and
  # the web and engine Dockerfiles learned `COPY patches ./patches` (d0ddd8ad),
  # but the runner's never did — its frozen install failed with ENOENT on
  # `patches/next@15.5.25.patch` and `deploy-host.yml` aborted mid-build, the
  # first place anybody could have seen it. A deploy is the worst time to find
  # out an image does not build; this job moves that discovery to the PR.
  #
  # `type=cacheonly` builds every stage and throws the result away: the claim
  # being proven is "this Dockerfile builds from a clean checkout", and pushing
  # stays the deploy workflow's job alone.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
            context: .
          - name: engine
            dockerfile: apps/engine/Dockerfile
            context: .
          - name: finops-runner
            dockerfile: apps/finops-runner/Dockerfile
            context: .
          # The deploy-time database toolbox (migrations, freeze, grants,
          # preflight) that deploy-host.yml runs on the host.
          - name: migrator
            dockerfile: ops/deploy/migrator/Dockerfile
            context: .
          # Same context the deploy uses: the database image is built from its
          # own directory, not the repo root.
          - name: db
            dockerfile: ops/deploy/db/Dockerfile
            context: ops/deploy/db
    name: image (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} (no push)
        run: |
          docker buildx build \
            --file "${{ matrix.dockerfile }}" \
            --build-arg "APP_VERSION=${GITHUB_SHA::12}" \
            --output type=cacheonly \
            "${{ matrix.context }}"

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Squash-merge turns the PR title into the commit message (§16–§18).
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
