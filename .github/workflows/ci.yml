# The single quality gate (IP-0_DESIGN §20). Target: < 8 minutes.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Generated tokens are committed; a rebuild must be a no-op (IP-1_DESIGN §6).
      - run: git diff --exit-code packages/ui/src/generated
      - run: pnpm format:check
      - run: pnpm depcruise
      - run: pnpm audit --prod --audit-level high

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: desiauction
          POSTGRES_PASSWORD: desiauction
          POSTGRES_DB: desiauction
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U desiauction"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://desiauction:desiauction@localhost:5433/desiauction
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every CI run proves the committed migrations apply cleanly (§20, §36).
      - run: pnpm --filter @desiauction/engine db:migrate
      - run: pnpm test:integration

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Squash-merge turns the PR title into the commit message (§16–§18).
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
