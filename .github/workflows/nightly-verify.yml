# Nightly verification (PRP-1 §5): the drills CI is too slow for — the full
# e2e journey suite (parked out of per-PR CI by the IP-3 gate decision), the
# fresh-migration proof, the RLS runtime probe under the non-BYPASSRLS role
# recipe, and the snapshot-consistent backup restore-verify. 03:00 IST.
name: nightly-verify

on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST
  workflow_dispatch:

# TWO KINDS OF JOB, SO NEITHER CAN STARVE THE OTHER (PRR 2026-09-29).
#
# Everything used to run in ONE job with ONE sixty-minute budget: migrations,
# the integration suite, the RLS probe, the restore drill, a build, three
# browser installs and the whole journey suite on three engines, one after the
# other. It stopped fitting. The job was cancelled at its limit on four
# consecutive nights — which GitHub reports as "cancelled", not "failed", mails
# nobody about, and which left no trace to read because the reporter was
# `list` and nothing was uploaded. The drills that DID pass (restore-verify
# among them) were invisible behind a red that meant only "ran out of time".
#
#   drills   migrations, integration, RLS probe, restore-verify.
#   e2e      one job per browser engine, in parallel, each with its own
#            database and its own budget. A slow WebKit night no longer
#            cancels Chromium's answer.
#   report   runs when either did not pass — cancelled included — and says so
#            where a person will see it.
permissions:
  contents: read

jobs:
  drills:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: desiauction
          POSTGRES_PASSWORD: desiauction
          POSTGRES_DB: desiauction
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U desiauction"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://desiauction:desiauction@localhost:5433/desiauction
      # THE E2E STEP RUNS AGAINST A COMPILED SERVER, like ci's e2e job does.
      #
      # Without this the suite runs against `next dev`, and an on-demand
      # compiler is what grows the heap: the server crosses its memory
      # threshold, restarts, and drops the requests in flight. Those arrive as
      # `ERR_CONNECTION_RESET` and `page.goto` timeouts spread across unrelated
      # specs — 27 of 96 on 2026-09-06, none of them a product defect, and the
      # same suite is 101/0 against a compiled server. A nightly that fails for
      # its own harness teaches everyone to ignore it.
      #
      # OTP_PROVIDER=dev is required by the suite (e2e/otp.ts reads codes from
      # otp_inbox); `next start` forces NODE_ENV=production, whose boot guard
      # refuses that provider — ALLOW_INSECURE_LOCAL_PRODUCTION is exactly the
      # escape for a production-shaped BUILD in a non-production CONTEXT.
      OTP_PROVIDER: dev
      PLAYWRIGHT_PRECOMPILED: "1"
      NEXT_DIST_DIR: .next-e2e
      ALLOW_INSECURE_LOCAL_PRODUCTION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Fresh migrations on a fresh database — the §36 proof, nightly.
      - run: pnpm --filter @desiauction/db db:migrate
      - run: pnpm --filter @desiauction/engine db:migrate

      - run: pnpm test:integration

      # RLS runtime verification under the production role recipe.
      #
      # The invocation passed TWO passwords to a script that requires FOUR and
      # sets ON_ERROR_STOP — so it aborted at the engine-role statement and this
      # step had never actually created desiauction_engine, desiauction_runner,
      # or applied the append-only revokes. The four-role recipe was therefore
      # never verified by anything (audit 2026-08-18, P1-3).
      - name: RLS probe under non-BYPASSRLS role
        run: |
          PGPASSWORD=desiauction psql -h localhost -p 5433 -U desiauction -d desiauction \
            --single-transaction -v ON_ERROR_STOP=1 \
            -v app_password='nightly-app' -v system_password='nightly-system' \
            -v engine_password='nightly-engine' -v runner_password='nightly-runner' \
            -f ops/db/create-app-role.sql
          APP_DATABASE_URL='postgres://desiauction_app:nightly-app@localhost:5433/desiauction' \
            pnpm --filter @desiauction/web rls:verify

      # Snapshot-consistent backup restore drill (host pg tools match the
      # service major via the postgres apt repo).
      - name: Restore-verify
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          RESTORE_VERIFY_CONTAINER="" pnpm --filter @desiauction/web db:restore-verify

  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # ci's Chromium-only run is given thirty; the other two engines are slower.
    timeout-minutes: 45
    strategy:
      # One engine failing is a finding about that engine, not a reason to
      # throw away the other two answers.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: desiauction
          POSTGRES_PASSWORD: desiauction
          POSTGRES_DB: desiauction
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U desiauction"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://desiauction:desiauction@localhost:5433/desiauction
      OTP_PROVIDER: dev
      PLAYWRIGHT_PRECOMPILED: "1"
      NEXT_DIST_DIR: .next-e2e
      ALLOW_INSECURE_LOCAL_PRODUCTION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @desiauction/db db:migrate
      - run: pnpm --filter @desiauction/engine db:migrate

      # PX-8: the finance journeys read the seeded exemplar. Financial
      # Operations has no issuance UI (issuing is not in PX-8's scope), so a
      # browser cannot provision documents for itself — the demo seed is the
      # project's own fixture for exactly this, and it is idempotent.
      - name: Seed the demo exemplar
        run: pnpm seed:demo

      # The full journey suite (real web + real engine + real WebSockets).
      #
      # Built before it is served: `PLAYWRIGHT_PRECOMPILED=1` swaps `next dev`
      # for `next start`, which serves whatever `.next-e2e` already holds and
      # builds nothing itself. Missing this step fails the suite at startup with
      # "Could not find a production build", two steps from its cause.
      - name: Build the server the suite will run against
        run: pnpm --filter @desiauction/web exec next build
      # Chromium, Firefox AND WebKit — the nightly is where cross-browser lives.
      # With no `projects` block, 135 tests had once only ever run on Chromium.
      # Per-commit CI stays Chromium-only: three engines roughly triple a run,
      # and what the other two catch (timing, layout) does not appear per commit.
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: apps/web
      # ~29 specs SKIP here by design: `next start` forces NODE_ENV=production
      # and the /gallery family is dev-only, so those pages correctly 404. They
      # report as skipped, not failed.
      - name: End-to-end journeys (${{ matrix.browser }})
        run: npx playwright test --project=${{ matrix.browser }}
        working-directory: apps/web
        env:
          CI: "true"
          # Adds the `firefox` and `webkit` projects — see playwright.config.ts.
          # Chromium is always defined; the other two exist only when asked for.
          E2E_FIREFOX: ${{ matrix.browser == 'firefox' && '1' || '' }}
          E2E_WEBKIT: ${{ matrix.browser == 'webkit' && '1' || '' }}
          # BACK IN, AND THIS TIME BECAUSE THE FLAKES ARE UNDERSTOOD (2026-09-24).
          #
          # They were pulled on 2026-09-10 after two full runs of the same code
          # failed differently each time, all in the live-auction path. Traced
          # one by one, with Firefox and WebKit on CI's two workers, it was five
          # separate defects — three in the product, two in the harness — that
          # Chromium's speed had been hiding:
          #
          #  * PRODUCT, engine: concurrent first touches after a restart each
          #    built their own state and the last to finish won, so a socket
          #    join could reinstall the pre-command snapshot. One shared load
          #    per auction now (live-engine integration "RESTART RACE").
          #  * PRODUCT, cockpit: "Needs resolution" read server props while the
          #    queue read the socket, so a requeued lot sat in both until a
          #    refresh, then the section vanished and shifted Open out from
          #    under the click (conduct-ceremony on Firefox).
          #  * PRODUCT, money consoles: a client-side filter waited on a router
          #    navigation the server ignores, which Firefox/WebKit sometimes
          #    never committed. Now written in place (`serverReads: false`).
          #  * HARNESS: `/admin/reset` with an empty body restarted EVERY
          #    auction on the shared engine — another worker's live night
          #    included. Specs now reset only their own auction.
          #  * HARNESS: a `goto` out of the cockpit aborted its in-flight
          #    refresh, and Next "fell back" to a hard navigation back to the
          #    cockpit (financial-issuance / settlement on WebKit). Specs leave
          #    by the header link now.
          #
          # Evidence before re-enabling: the eight specs that run an auction
          # (settlement and issuance included) 160/160 on Firefox + WebKit across five consecutive repeats
          # (--repeat-each=5, --retries=0, two workers), then the full suite on
          # all three engines with --retries=0: 444 passed, 0 failed, 90 skipped
          # (Chromium 149, Firefox 148, WebKit 147).
          #
          # If a Firefox/WebKit-only failure shows up here again, trace it
          # (`--trace retain-on-failure`) before reaching for a retry or a
          # timeout: every one of the five above looked like flakiness and was
          # a race with a cause.

      # What a failure looked like, kept — ci has always uploaded this and the
      # nightly never did, so a red night had nothing behind it to read.
      - uses: actions/upload-artifact@v4
        if: ${{ !success() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # SAID WHERE SOMEBODY WILL SEE IT. `!success()` rather than `failure()`: a job
  # that ran out of time is CANCELLED, which `failure()` does not match and
  # which is exactly the outcome that went unnoticed for four nights.
  report:
    needs: [drills, e2e]
    if: ${{ always() && (needs.drills.result != 'success' || needs.e2e.result != 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Say what did not pass
        env:
          DRILLS: ${{ needs.drills.result }}
          E2E: ${{ needs.e2e.result }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "### Nightly verification did not pass"
            echo ""
            echo "| job | result |"
            echo "|---|---|"
            echo "| drills (migrations, integration, RLS, restore-verify) | ${DRILLS} |"
            echo "| e2e (chromium, firefox, webkit) | ${E2E} |"
            echo ""
            echo "\`cancelled\` means a job ran out of its time budget, not that it was stopped by hand."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${ALERT_WEBHOOK_URL}" ]; then
            curl -fsS -m 20 -X POST -H 'content-type: application/json' \
              --data "{\"title\":\"DesiAuction nightly verification did not pass\",\"drills\":\"${DRILLS}\",\"e2e\":\"${E2E}\",\"run\":\"${RUN_URL}\"}" \
              "${ALERT_WEBHOOK_URL}" >/dev/null \
              || echo "::warning::the alert webhook did not accept the report"
          else
            echo "::warning::ALERT_WEBHOOK_URL is not set as a repository secret — this failure was reported on the run page only"
          fi
          exit 1
