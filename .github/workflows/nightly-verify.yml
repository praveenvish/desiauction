# Nightly verification (PRP-1 §5): the drills CI is too slow for — the full
# e2e journey suite (parked out of per-PR CI by the IP-3 gate decision), the
# fresh-migration proof, the RLS runtime probe under the non-BYPASSRLS role
# recipe, and the snapshot-consistent backup restore-verify. 03:00 IST.
name: nightly-verify

on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: desiauction
          POSTGRES_PASSWORD: desiauction
          POSTGRES_DB: desiauction
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U desiauction"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://desiauction:desiauction@localhost:5433/desiauction
      # THE E2E STEP RUNS AGAINST A COMPILED SERVER, like ci's e2e job does.
      #
      # Without this the suite runs against `next dev`, and an on-demand
      # compiler is what grows the heap: the server crosses its memory
      # threshold, restarts, and drops the requests in flight. Those arrive as
      # `ERR_CONNECTION_RESET` and `page.goto` timeouts spread across unrelated
      # specs — 27 of 96 on 2026-09-06, none of them a product defect, and the
      # same suite is 101/0 against a compiled server. A nightly that fails for
      # its own harness teaches everyone to ignore it.
      #
      # OTP_PROVIDER=dev is required by the suite (e2e/otp.ts reads codes from
      # otp_inbox); `next start` forces NODE_ENV=production, whose boot guard
      # refuses that provider — ALLOW_INSECURE_LOCAL_PRODUCTION is exactly the
      # escape for a production-shaped BUILD in a non-production CONTEXT.
      OTP_PROVIDER: dev
      PLAYWRIGHT_PRECOMPILED: "1"
      NEXT_DIST_DIR: .next-e2e
      ALLOW_INSECURE_LOCAL_PRODUCTION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Fresh migrations on a fresh database — the §36 proof, nightly.
      - run: pnpm --filter @desiauction/db db:migrate
      - run: pnpm --filter @desiauction/engine db:migrate

      - run: pnpm test:integration

      # RLS runtime verification under the production role recipe.
      #
      # The invocation passed TWO passwords to a script that requires FOUR and
      # sets ON_ERROR_STOP — so it aborted at the engine-role statement and this
      # step had never actually created desiauction_engine, desiauction_runner,
      # or applied the append-only revokes. The four-role recipe was therefore
      # never verified by anything (audit 2026-08-18, P1-3).
      - name: RLS probe under non-BYPASSRLS role
        run: |
          PGPASSWORD=desiauction psql -h localhost -p 5433 -U desiauction -d desiauction \
            -v ON_ERROR_STOP=1 \
            -v app_password='nightly-app' -v system_password='nightly-system' \
            -v engine_password='nightly-engine' -v runner_password='nightly-runner' \
            -f ops/db/create-app-role.sql
          APP_DATABASE_URL='postgres://desiauction_app:nightly-app@localhost:5433/desiauction' \
            pnpm --filter @desiauction/web rls:verify

      # Snapshot-consistent backup restore drill (host pg tools match the
      # service major via the postgres apt repo).
      - name: Restore-verify
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          RESTORE_VERIFY_CONTAINER="" pnpm --filter @desiauction/web db:restore-verify

      # PX-8: the finance journeys read the seeded exemplar. Financial
      # Operations has no issuance UI (issuing is not in PX-8's scope), so a
      # browser cannot provision documents for itself — the demo seed is the
      # project's own fixture for exactly this, and it is idempotent.
      - name: Seed the demo exemplar
        run: pnpm seed:demo

      # The full journey suite (real web + real engine + real WebSockets).
      #
      # Built before it is served: `PLAYWRIGHT_PRECOMPILED=1` swaps `next dev`
      # for `next start`, which serves whatever `.next-e2e` already holds and
      # builds nothing itself. Missing this step fails the suite at startup with
      # "Could not find a production build", two steps from its cause.
      - name: Build the server the suite will run against
        run: pnpm --filter @desiauction/web exec next build
      # WebKit as well as Chromium — the nightly is where cross-browser lives.
      # `KNOWN_LIMITATIONS.md` listed real cross-browser as an open verification
      # gap and it was: with no `projects` block declared, 135 tests had only
      # ever run on Chromium. Per-commit CI stays Chromium-only because WebKit
      # doubles a ~5-minute run and the defects it catches (timing, layout) do
      # not appear per commit.
      - run: npx playwright install --with-deps chromium webkit firefox
        working-directory: apps/web
      # ~29 specs SKIP here by design: `next start` forces NODE_ENV=production
      # and the /gallery family is dev-only, so those pages correctly 404. They
      # report as skipped, not failed.
      - name: End-to-end journeys (Chromium + WebKit + Firefox)
        run: npx playwright test
        working-directory: apps/web
        env:
          CI: "true"
          # Add the `webkit` and `firefox` projects — see playwright.config.ts.
          E2E_WEBKIT: "1"
          E2E_FIREFOX: "1"
